[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof"
version = "0.2.0"
description = "Vendor-neutral pre-execution Ed25519 receipts, MCP/agent scanner, and AIUC-1 / EU AI Act evidence for AI agents — with the AgentProof.cloud commercial service in the same repository."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "agentproof contributors" }]
keywords = [
    "ai", "agents", "compliance", "eu-ai-act", "audit", "regression-testing",
    "mcp", "ed25519", "evidence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

# Deliberately minimal. No agent SDK, no model-provider client, no telemetry.
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=41.0",
    "click>=8.1",
]

[project.optional-dependencies]
# Commercial service (site + API) and dev tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
agentproof = "agentproof.cli:main"

[project.urls]
Homepage = "https://github.com/yepinggu66/agentproof-cloud"
Issues = "https://github.com/yepinggu66/agentproof-cloud/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentproof = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/agentproof", "server"]
branch = true
